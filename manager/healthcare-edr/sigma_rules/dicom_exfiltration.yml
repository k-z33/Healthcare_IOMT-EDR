title: Unauthorized DICOM Image Transfer Detected
id: 8f3e2b1a-4c5d-4e6f-9a1b-2c3d4e5f6a7b
status: experimental
description: |
  Detects unauthorized transfer of DICOM (medical imaging) files from an
  imaging device, indicating possible PHI exfiltration. CVSS v3.1 Base
  Score: 7.5 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N) - High.
author: Kainat Zahra
date: 2026/08/10
references:
  - HIPAA 45 CFR 164.404 (Breach Notification Rule)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'dicom'
  condition: selection
falsepositives:
  - Legitimate scheduled DICOM archival transfers to approved PACS servers
level: high
tags:
  - attack.exfiltration
  - attack.t1537
  - healthcare.iomt
  - healthcare.hipaa

