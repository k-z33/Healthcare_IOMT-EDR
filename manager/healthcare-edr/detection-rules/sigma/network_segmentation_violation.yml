title: Network Segmentation (Zone) Violation
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f37
status: experimental
description: |
  Detects a device reaching a network zone it is not authorized to access,
  indicating a possible segmentation bypass or lateral movement following
  compromise. CVSS v3.1 Base Score: 8.1
  (AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(a)(1) (Access Control)
  - Wazuh rule 100237 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'Segmentation violation'
  condition: selection
falsepositives:
  - Firewall rule change legitimately expanding access ahead of the
    segmentation policy documentation being updated
level: high
tags:
  - attack.lateral_movement
  - attack.t1021
  - healthcare.iomt
  - healthcare.hipaa
