title: Device Data Volume Spike
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f03
status: experimental
description: |
  Detects an abnormal spike in outbound data volume from an IoMT device,
  exceeding the expected connection baseline, consistent with possible data
  exfiltration. CVSS v3.1 Base Score: 6.5
  (AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N) - Medium.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.308(a)(6) (Security Incident Procedures)
  - Wazuh rule 100203 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'data volume spike'
  condition: selection
falsepositives:
  - Legitimate large scheduled data sync or backup job from the device
level: medium
tags:
  - attack.exfiltration
  - attack.t1030
  - healthcare.iomt
  - healthcare.hipaa
