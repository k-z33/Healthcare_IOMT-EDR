title: Device Clock or Time-Sync Anomaly
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f13
status: experimental
description: |
  Detects a clock or time-synchronization anomaly on a medical device, which
  may indicate an attempt to tamper with log timestamps and undermine
  forensic integrity. CVSS v3.1 Base Score: 5.3
  (AV:A/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N) - Medium.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(b) (Audit Controls)
  - Wazuh rule 100213 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'clock or time-sync anomaly'
  condition: selection
falsepositives:
  - NTP server outage causing legitimate clock drift across multiple devices
    simultaneously
level: medium
tags:
  - attack.defense_evasion
  - attack.t1070
  - healthcare.iomt
  - healthcare.hipaa
