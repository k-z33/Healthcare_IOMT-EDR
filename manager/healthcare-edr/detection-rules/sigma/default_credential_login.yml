title: Default or Weak Credential Login
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f08
status: experimental
description: |
  Detects a login to a medical device using default or known-weak vendor
  credentials, a common initial-access vector for IoMT compromise. CVSS v3.1
  Base Score: 8.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.308(a)(5)(ii)(D) (Password Management)
  - Wazuh rule 100208 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'default or weak credentials'
  condition: selection
falsepositives:
  - Biomedical engineering performing authorized diagnostics with the vendor
    service account before scheduled credential rotation
level: high
tags:
  - attack.initial_access
  - attack.t1078
  - healthcare.iomt
  - healthcare.hipaa
