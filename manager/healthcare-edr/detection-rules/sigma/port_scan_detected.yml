title: Port Scan Detected
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f35
status: experimental
description: |
  Detects a source host touching an unusually high number of distinct ports
  against clinical network hosts, consistent with active port
  scanning/reconnaissance. CVSS v3.1 Base Score: 7.3
  (AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(b) (Audit Controls)
  - Wazuh rule 100235 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'Port scan detected'
  condition: selection
falsepositives:
  - Authorized internal vulnerability scanner sweeping the subnet on its
    scheduled cadence
level: high
tags:
  - attack.discovery
  - attack.t1046
  - healthcare.iomt
  - healthcare.hipaa
