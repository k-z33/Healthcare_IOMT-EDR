title: HL7 Message Tampering Detected
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f22
status: experimental
description: |
  Detects tampering with HL7 message segments in transit involving a medical
  device, indicating a possible man-in-the-middle attack against clinical
  data integrity. CVSS v3.1 Base Score: 8.1
  (AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(c)(1) (Integrity)
  - Wazuh rule 100222 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'HL7 message tampering'
  condition: selection
falsepositives:
  - Interface engine transformation misclassified as tampering due to an
    unapproved but benign mapping change
level: high
tags:
  - attack.impact
  - attack.t1565
  - healthcare.iomt
  - healthcare.hipaa
