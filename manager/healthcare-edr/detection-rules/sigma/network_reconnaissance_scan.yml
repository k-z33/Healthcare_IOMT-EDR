title: Network Reconnaissance or Scanning Activity
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f25
status: experimental
description: |
  Detects possible network reconnaissance or scanning activity involving an
  IoMT device, either as source or target, which frequently precedes a
  targeted attack. CVSS v3.1 Base Score: 5.3
  (AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N) - Medium.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(b) (Audit Controls)
  - Wazuh rule 100225 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'reconnaissance/scanning activity'
  condition: selection
falsepositives:
  - Authorized vulnerability assessment scan run by the security team without
    prior notification to on-call staff
level: medium
tags:
  - attack.discovery
  - attack.t1046
  - healthcare.iomt
  - healthcare.hipaa
