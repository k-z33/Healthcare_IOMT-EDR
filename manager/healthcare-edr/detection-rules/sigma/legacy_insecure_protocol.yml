title: Legacy or Insecure Protocol Usage
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f07
status: experimental
description: |
  Detects a medical device using an insecure legacy protocol (e.g., Telnet,
  FTP) instead of an encrypted channel, exposing credentials and clinical
  data in transit. CVSS v3.1 Base Score: 7.4
  (AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(e)(1) (Transmission Security)
  - Wazuh rule 100207 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'insecure legacy protocol'
  condition: selection
falsepositives:
  - Legacy device with no vendor-supported encrypted protocol, compensating-
    controlled on an isolated VLAN
level: high
tags:
  - attack.credential_access
  - attack.t1552
  - healthcare.iomt
  - healthcare.hipaa
