title: Possible Replay Attack Detected
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f11
status: experimental
description: |
  Detects indicators of a replay attack against a medical device - duplicate
  or out-of-sequence messages - which could be used to re-inject stale
  commands or falsify telemetry. CVSS v3.1 Base Score: 6.8
  (AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N) - Medium.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(c)(1) (Integrity)
  - Wazuh rule 100211 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'replay attack'
  condition: selection
falsepositives:
  - Network jitter causing a legitimate retransmission that is misclassified
    as replay
level: medium
tags:
  - attack.impact
  - attack.t1499
  - healthcare.iomt
  - healthcare.hipaa
