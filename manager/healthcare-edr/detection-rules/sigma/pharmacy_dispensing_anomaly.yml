title: Pharmacy Dispensing Cabinet Anomalous Activity
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f19
status: experimental
description: |
  Detects anomalous activity on a pharmacy automated dispensing cabinet,
  which may indicate insider-driven medication diversion or device
  compromise. CVSS v3.1 Base Score: 7.1
  (AV:A/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.308(a)(3) (Workforce Security)
  - Wazuh rule 100219 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'Pharmacy dispensing cabinet'
  condition: selection
falsepositives:
  - Pharmacy staff performing a legitimate high-volume restock outside typical
    dispensing patterns
level: high
tags:
  - attack.initial_access
  - attack.t1078
  - healthcare.iomt
  - healthcare.hipaa
  - healthcare.insider-threat
