title: Repeated Firewall Violations (Active Reconnaissance)
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f41
status: experimental
description: |
  Detects repeated firewall/ACL violations from the same device within a
  short window, escalating a single blocked attempt into a likely active-
  reconnaissance signal. CVSS v3.1 Base Score: 7.1
  (AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.308(a)(6) (Security Incident Procedures)
  - Wazuh rule 100241 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'repeated firewall violations'
  condition: selection
falsepositives:
  - Misconfigured client repeatedly retrying a now-deprecated endpoint without
    malicious intent
level: high
tags:
  - attack.reconnaissance
  - attack.t1595
  - healthcare.iomt
  - healthcare.hipaa
