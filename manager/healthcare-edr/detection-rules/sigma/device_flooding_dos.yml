title: Abnormally Frequent Device Connections (Flooding/DoS)
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f05
status: experimental
description: |
  Detects an IoMT device sending an abnormally high frequency of connection
  events within a short window, consistent with flooding or denial-of-
  service activity targeting device availability. CVSS v3.1 Base Score: 6.5
  (AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H) - Medium.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.308(a)(6) (Security Incident Procedures)
  - Wazuh rule 100205 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'abnormally frequent connections'
  condition: selection
falsepositives:
  - Bulk telemetry re-sync immediately after a network outage recovery
level: medium
tags:
  - attack.impact
  - attack.t0814
  - healthcare.iomt
  - healthcare.patient-safety
  - healthcare.hipaa
