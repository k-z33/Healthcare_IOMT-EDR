title: Patient Monitor Anomalous Activity
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f17
status: experimental
description: |
  Detects anomalous network activity on a patient monitor (unknown
  destination, unexpected port, or data volume spike), risking the integrity
  of vitals data relied on for clinical decisions. CVSS v3.1 Base Score: 7.7
  (AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.308(a)(6) (Security Incident Procedures - Patient Safety)
  - Wazuh rule 100217 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'Patient monitor'
  condition: selection
falsepositives:
  - Firmware update session temporarily changing the monitor's normal traffic
    pattern
level: high
tags:
  - attack.impact
  - attack.t0836
  - healthcare.iomt
  - healthcare.patient-safety
  - healthcare.hipaa
