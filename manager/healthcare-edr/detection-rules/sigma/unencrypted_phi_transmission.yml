title: Unencrypted PHI-Carrying Protocol Transmission
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f12
status: experimental
description: |
  Detects a PHI-carrying clinical protocol (e.g., DICOM, HL7) being
  transmitted without encryption, exposing patient data in transit. CVSS
  v3.1 Base Score: 5.9 (AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N) - Medium.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(e)(1) (Transmission Security - Encryption)
  - Wazuh rule 100212 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'PHI-carrying protocol without encryption'
  condition: selection
falsepositives:
  - Internal-only segment traffic compensating-controlled by network isolation
    rather than protocol-level encryption
level: medium
tags:
  - attack.credential_access
  - attack.t1040
  - healthcare.iomt
  - healthcare.hipaa
