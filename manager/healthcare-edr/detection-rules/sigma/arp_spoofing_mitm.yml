title: ARP Spoofing / MITM Detected
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f34
status: experimental
description: |
  Detects a MAC/IP address mismatch consistent with ARP spoofing, indicating
  a possible man-in-the-middle attack against clinical network traffic. CVSS
  v3.1 Base Score: 8.1 (AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(e)(1) (Transmission Security)
  - Wazuh rule 100234 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'ARP spoofing'
  condition: selection
falsepositives:
  - Network switch/router failover legitimately reassigning MAC-to-IP bindings
level: high
tags:
  - attack.collection
  - attack.t1557
  - healthcare.iomt
  - healthcare.hipaa
