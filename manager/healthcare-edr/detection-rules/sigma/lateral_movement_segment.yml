title: Lateral Movement to Admin or Billing Segment
id: 6a1b2c3d-4e5f-4071-8a01-1b2c3d4e5f14
status: experimental
description: |
  Detects a clinical/IoMT device attempting to reach the administrative or
  billing network segment, indicating possible lateral movement following
  device compromise. CVSS v3.1 Base Score: 8.1
  (AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N) - High.
author: Kainat Zahra
date: 2026/08/12
references:
  - HIPAA 45 CFR 164.312(a)(1) (Access Control)
  - Wazuh rule 100214 (iomt_custom_rules.xml / iomt_network_security_rules.xml)
logsource:
  category: iomt
  product: wazuh
detection:
  selection:
    rule.description|contains: 'admin or billing network segment'
  condition: selection
falsepositives:
  - Newly deployed integration engine legitimately bridging clinical and
    billing systems, not yet documented in the segmentation policy
level: high
tags:
  - attack.lateral_movement
  - attack.t1021
  - healthcare.iomt
  - healthcare.hipaa
